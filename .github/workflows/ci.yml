name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Run versioned incident corpus
        run: make corpus
      - name: Upload corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-corpus-v1-${{ github.sha }}
          path: .kestrel/corpus-runs/
          if-no-files-found: error
          retention-days: 14
